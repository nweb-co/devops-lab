apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: devops-lab:dev
spec:
  project: default
  source:
    repoURL: https://github.com/nweb-co/devops-lab.git
    targetRevision: main
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - CreateNamespace=true